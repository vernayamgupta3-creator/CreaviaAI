<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creavia — Learn Smarter</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="brand">creavia<span>.</span></div>

        <button class="new-chat" onclick="newChat()">
            <span>+</span> New conversation
        </button>

        <div class="sidebar-section">
            <p class="section-label">YOUR SPACE</p>

            <button class="nav-item active">Conversations</button>
            <button class="nav-item">My documents</button>
        </div>

        <div class="history">
            <p class="section-label">RECENT</p>
            <div id="historyList"></div>
        </div>

        <div class="sidebar-footer">
            <div class="profile">
                <div class="profile-avatar">S</div>
                <div>
                    <div class="profile-name">Student</div>
                    <div class="profile-plan">Free plan</div>
                </div>
            </div>
        </div>

    </aside>


    <main class="main">

        <header class="topbar">
            <div class="topbar-title">AI Study Assistant</div>
            <div class="topbar-status">Online</div>
        </header>


        <section class="conversation" id="chatContainer">

            <div class="empty-state" id="welcome">

                <h1>What are you learning today?</h1>

                <p>
                    A quieter space to think, understand and learn.
                </p>

            </div>

        </section>


        <footer class="composer-area">

            <div class="composer">

                <textarea id="userInput" placeholder="Ask Creavia anything..." rows="1"></textarea>

                <button class="send-button" onclick="sendMessage()">
                    ↑
                </button>

            </div>

            <p class="footer-note">
                Creavia can make mistakes. Verify important information.
            </p>

        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
